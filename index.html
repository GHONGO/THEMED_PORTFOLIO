<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Griffin Hongo | Full Stack Developer</title>
    <meta name="description" content="Full stack developer building fast, intuitive web apps and smart automations across modern web technologies." />

    <!-- Restore saved theme before first paint (prevents a flash of the wrong theme) -->
    <script>
      try {
        var r = document.documentElement, t = localStorage.getItem('theme');
        if (t) r.dataset.theme = t;
        if (localStorage.getItem('mode') === 'dark') r.classList.add('dark');
      } catch (e) {}
    </script>

    <!-- Fonts (the GTA theme loads its own fonts only when it is used) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/griffin.webp" />

    <!-- Canonical -->
    <link rel="canonical" href="https://griffin-hongo.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://griffin-hongo.vercel.app/" />
    <meta property="og:title" content="Griffin Hongo | Full Stack Developer" />
    <meta property="og:description" content="Full stack developer building fast, intuitive web apps and smart automations across modern web technologies." />
    <meta property="og:image" content="https://griffin-hongo.vercel.app/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Griffin Hongo | Full Stack Developer" />
    <meta name="twitter:description" content="Full stack developer building fast, intuitive web apps and smart automations across modern web technologies." />
    <meta name="twitter:image" content="https://griffin-hongo.vercel.app/og-image.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
